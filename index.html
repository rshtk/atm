<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Технические работы</title>
  <style>
    /* Общие стили */
    body {
      margin: 0;
      padding: 20px;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }

    /* Название сверху */
    .logo {
      font-size: 2.5em;
      font-weight: bold;
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      letter-spacing: 2px;
    }

    /* Заголовок */
    h1 {
      font-size: 2em;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
      animation: pulse 2s infinite;
    }

    /* Подзаголовок */
    p {
      font-size: 1em;
      margin-bottom: 25px;
      max-width: 90%;
      line-height: 1.4;
    }

    /* Кнопка / ссылка */
    a {
      display: inline-block;
      padding: 12px 25px;
      background-color: #007aff;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.2em;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: background-color 0.3s, transform 0.3s;
    }

    a:hover {
      background-color: #005bb5;
      transform: scale(1.05);
    }

    /* Анимации */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Анимация градиента фона с миганием */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(270deg, #000000, #ffcc99, #000000);
      background-size: 600% 600%;
      animation: gradientPulse 10s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes gradientPulse {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Размеры для мобильных */
    @media (max-width: 600px) {
      .logo {
        font-size: 2em;
      }
      h1 {
        font-size: 1.8em;
      }
      p {
        font-size: 0.9em;
      }
      a {
        padding: 12px 20px;
        font-size: 1.1em;
      }
    }
  </style>
</head>
<body>
  <div class="logo">LUXIA</div>
  <h1>Ведутся технические работы</h1>
  <p>Наш сайт временно недоступен. Следите за обновлениями или свяжитесь с нами через Telegram:</p>
  <a href="tg://resolve?domain=@pvsvzlomka" target="_blank" 
     onclick="setTimeout(function(){ window.location='https://t.me/@luxiaolin'; }, 500);">
    Перейти в Telegram
  </a>
</body>
</html>
