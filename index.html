<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>LUXIA ROOTLESS</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 50;
  padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
  background: rgba(0, 0, 0, 0.72);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
  text-align: center;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.topbar.hidden { opacity: 0; transform: translateY(-100%); pointer-events: none; }
.brand { font-size: 15px; font-weight: 800; letter-spacing: 4px; color: #fff; }
.content {
  position: absolute; inset: 0; z-index: 1;
  padding: calc(78px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.info { text-align: center; margin-bottom: 36px; }
.ver { font-size: 14px; color: rgba(255,255,255,0.55); letter-spacing: 0.4px; margin-bottom: 6px; }
.tg { display: inline-block; font-size: 13px; color: #00e5c0; text-decoration: none; letter-spacing: 0.4px; }
.stages {
  list-style: none; margin: 0; padding: 0;
  width: 100%; max-width: 400px;
  display: flex; flex-direction: column; gap: 10px;
}
.stage {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 14px;
  background: rgba(255,255,255,0.035);
  border: 0.5px solid rgba(255,255,255,0.07);
  font-size: 14px; color: rgba(255,255,255,0.85);
  letter-spacing: 0.2px;
  opacity: 0; transform: translateY(10px);
  animation: stageIn 0.4s cubic-bezier(0.2,0.8,0.3,1) forwards;
}
@keyframes stageIn { to { opacity: 1; transform: none; } }
.stage.running { background: rgba(0,229,192,0.06); border-color: rgba(0,229,192,0.3); color: #fff; }
.stage.done { color: rgba(255,255,255,0.6); }
.dot {
  position: relative; width: 22px; height: 22px; flex: 0 0 22px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,0.18);
  transition: border-color 0.25s ease, background 0.25s ease;
}
.stage.running .dot {
  border-color: rgba(255,255,255,0.12);
  border-top-color: #00e5c0;
  border-right-color: #00e5c0;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.stage.done .dot { border-color: #30d158; background: rgba(48,209,88,0.14); animation: none; }
.check { position: absolute; inset: 0; margin: auto; width: 14px; height: 14px; overflow: visible; }
.check path {
  fill: none; stroke: #30d158; stroke-width: 3.2;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 24; stroke-dashoffset: 24;
}
.stage.done .check path { animation: draw 0.42s cubic-bezier(0.2,0.8,0.3,1) forwards 0.08s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.label { flex: 1; line-height: 1.25; }
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
  display: flex; justify-content: center;
  background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.9) 45%);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.bottom.hidden { opacity: 0; transform: translateY(30px); pointer-events: none; }
.start-btn {
  width: 100%; max-width: 400px;
  padding: 17px 20px; border-radius: 16px;
  border: 0.5px solid rgba(0,229,192,0.35);
  font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.6px;
  color: #fff; cursor: pointer;
  background: linear-gradient(180deg, #00c9a7, #007a68);
  box-shadow: 0 10px 32px rgba(0,200,170,0.28), inset 0 1px 0 rgba(255,255,255,0.22);
  transition: transform 0.12s ease, filter 0.2s ease;
}
.start-btn:active { transform: scale(0.975); filter: brightness(0.92); }
.start-btn:disabled {
  background: rgba(48,209,88,0.14); border-color: rgba(48,209,88,0.5);
  color: #30d158; box-shadow: none; cursor: default; transform: none;
}
#blackout {
  position: fixed; inset: 0; background: #000;
  z-index: 9999;
  display: none;
}
#blackout.on { display: block; }
#logOverlay {
  position: fixed; inset: 0; background: #000;
  z-index: 10000;
  display: none;
  overflow: hidden;
}
#logOverlay.show { display: block; }
#logStream {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  padding-top: env(safe-area-inset-top);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 7px;
  line-height: 1.3;
  color: #ffffff;
  overflow: hidden;
}
.log-line {
  display: block;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  color: #ffffff;
  padding-left: 4px;
  padding-right: 4px;
}
#bootScreen {
  position: fixed; inset: 0;
  background: #000;
  z-index: 99999;
  display: none;
  align-items: center;
  justify-content: center;
}
#bootScreen.show { display: flex; }
#bootScreen svg {
  width: 75px;
  height: 75px;
  display: block;
  fill: #ffffff;
}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand">LUXIA ROOTLESS</div>
</header>

<main class="content" id="content">
  <div class="info">
    <div class="ver">iOS 18.0 – 27.0.1</div>
    <a class="tg" href="https://t.me/luxiaolin" target="_blank" rel="noopener">@luxiaolin</a>
  </div>
  <ul class="stages" id="stages"></ul>
</main>

<div class="bottom" id="bottom">
  <button class="start-btn" id="startBtn">Start Exploit</button>
</div>

<div id="blackout"></div>

<div id="logOverlay">
  <div id="logStream"></div>
</div>

<div id="bootScreen">
  <svg viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
  </svg>
</div>

<script>
(function() {
  "use strict";

  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const hx = n => Array.from({ length: n }, () => "0123456789abcdef"[rnd(0, 15)]).join("");
  const pad = (n, l) => String(n).padStart(l, "0");
  const ts = () => {
    const d = new Date();
    return pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2) + ":" +
           pad(d.getSeconds(), 2) + "." + pad(d.getMilliseconds(), 3);
  };

  const topbar     = $("topbar");
  const content    = $("content");
  const stagesEl   = $("stages");
  const bottom     = $("bottom");
  const startBtn   = $("startBtn");
  const blackout   = $("blackout");
  const logOverlay = $("logOverlay");
  const logStream  = $("logStream");
  const bootScreen = $("bootScreen");

  const STAGES = [
    { label: "Checking device compatibility", dur: 600 },
    { label: "Downloading kernel",            dur: 6000 },
    { label: "Bypassing PPL",                 dur: 7000 },
    { label: "Patching AMFI",                 dur: 5002 },
    { label: "Escalating privileges",         dur: 999 },
    { label: "Installing bootstrap",          dur: 9000 },
    { label: "Restarting SpringBoard",        dur: 1500, blackout: 1701 },
    { label: "Finalizing",                    dur: 2591 }
  ];

  const LOGS = [
    () => `[${ts()}] kfd: kread64(0xfffffff0${hx(6)}) = 0x${hx(12)}`,
    () => `[${ts()}] kfd: kwrite64(0xffffffe0${hx(6)}, 0x${hx(12)}) ok`,
    () => `[${ts()}] kernel: patching offset 0x${hx(8)} (${rnd(4,64)} bytes)`,
    () => `[${ts()}] kernel: base 0xfffffff007004000 slide 0x${hx(9)}`,
    () => `[${ts()}] kernel: kaslr defeated`,
    () => `[${ts()}] ppl: bypass ok, slide=0x${hx(9)}`,
    () => `[${ts()}] ppl: pmap_enter_options patched`,
    () => `[${ts()}] amfi: CS_ENFORCEMENT -> 0`,
    () => `[${ts()}] amfi: bypassed at 0xfffffff0${hx(7)}`,
    () => `[${ts()}] sandbox: ext 0x${hx(6)} escaped`,
    () => `[${ts()}] sandbox: sb_policy patched`,
    () => `[${ts()}] trustcache: loaded ${rnd(120,980)} hashes`,
    () => `[${ts()}] trustcache: appended 0x${hx(8)}`,
    () => `[${ts()}] proc: task_for_pid(0) -> ok`,
    () => `[${ts()}] proc: pid ${rnd(100,999)} spawned`,
    () => `[${ts()}] iomfb: mapped @ 0x${hx(10)}`,
    () => `[${ts()}] iomfb: swap enabled`,
    () => `[${ts()}] nvram: boot-args="${hx(4)}-${hx(4)}"`,
    () => `[${ts()}] nvram: boot-nonce cleared`,
    () => `[${ts()}] launchd: reloading ${rnd(10,90)} services`,
    () => `[${ts()}] launchd: com.apple.${["springboard","backboardd","mobileactivationd","sileo","sshd"][rnd(0,4)]} restarted`,
    () => `[${ts()}] dyld: shared cache patched`,
    () => `[${ts()}] dyld: closure 0x${hx(10)} rebuilt`,
    () => `[${ts()}] springboard: respawn requested`,
    () => `[${ts()}] springboard: icon cache invalidated`,
    () => `[${ts()}] rootfs: mounted /private/preboot`,
    () => `[${ts()}] rootfs: snapshot 0x${hx(8)} sealed`,
    () => `[${ts()}] bootstrap: installed ${rnd(20,300)} packages`,
    () => `[${ts()}] bootstrap: /var/jb ready`,
    () => `[${ts()}] sileo: repo luxia.rootless added`,
    () => `[${ts()}] sileo: index fetched (${rnd(1,20)}MB)`,
    () => `[${ts()}] mobileactivationd: bypass ok`,
    () => `[${ts()}] coretrust: signature ignored`,
    () => `[${ts()}] coretrust: anchors updated`,
    () => `[${ts()}] kmem: r/w established`,
    () => `[${ts()}] kmem: primitives ready`,
    () => `[${ts()}] escalate: uid=0 gid=0`,
    () => `[${ts()}] escalate: sandbox extension granted`,
    () => `[${ts()}] vm_map: prot=rwx @ 0x${hx(10)}`,
    () => `[${ts()}] vm_map: pmap %p -> %p`,
    () => `[${ts()}] hg: hm_slot ${rnd(1,16)} patched`,
    () => `[${ts()}] sep: firmware ver ${rnd(1,9)}.${rnd(0,9)}.${rnd(0,9)}`,
    () => `[${ts()}] watchdog: disabled`,
    () => `[${ts()}] panic: none`,
    () => `[${ts()}] ok (${rnd(1,40)}ms)`,
    () => `[${ts()}] retry ${rnd(1,5)} -> success`
  ];

  function makeStageRow(label) {
    const li = document.createElement("li");
    li.className = "stage";
    li.innerHTML =
      '<span class="dot">' +
        '<svg class="check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>' +
      '</span>' +
      '<span class="label"></span>';
    li.querySelector(".label").textContent = label;
    stagesEl.appendChild(li);
    return li;
  }

  async function goFullscreen() {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen)            await el.requestFullscreen({ navigationUI: "hide" });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.webkitEnterFullscreen)   el.webkitEnterFullscreen();
    } catch (e) {}
    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("portrait").catch(() => {});
      }
    } catch (e) {}
  }

  async function doBlackout(ms) {
    blackout.classList.add("on");
    await sleep(ms);
    blackout.classList.remove("on");
  }

  async function runFinalLogs() {
    logStream.innerHTML = "";
    logOverlay.classList.add("show");

    await sleep(2000);

    const t0 = Date.now();
    const duration = 3000;

    const pauseCount = rnd(3, 4);
    const pauses = [];
    for (let i = 0; i < pauseCount; i++) {
      pauses.push({
        at: rnd(Math.floor(duration * 0.10), Math.floor(duration * 0.85)),
        dur: rnd(180, 420),
        done: false
      });
    }

    while (Date.now() - t0 < duration) {
      const elapsed = Date.now() - t0;

      for (const p of pauses) {
        if (!p.done && elapsed >= p.at) {
          p.done = true;
          await sleep(p.dur);
          break;
        }
      }

      const line = document.createElement("div");
      line.className = "log-line";
      line.textContent = LOGS[rnd(0, LOGS.length - 1)]();

      if (logStream.firstChild) {
        logStream.insertBefore(line, logStream.firstChild);
      } else {
        logStream.appendChild(line);
      }

      while (logStream.childElementCount > 300) {
        logStream.removeChild(logStream.lastChild);
      }

      await sleep(rnd(8, 16));
    }

    await sleep(300);
    logOverlay.classList.remove("show");
  }

  let running = false;

  async function startExploit() {
    if (running) return;
    running = true;

    await goFullscreen();

    bottom.classList.add("hidden");
    stagesEl.innerHTML = "";

    for (let i = 0; i < STAGES.length; i++) {
      const s  = STAGES[i];
      const li = makeStageRow(s.label);
      li.classList.add("running");

      try { li.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}

      if (s.blackout) {
        await sleep(300);
        await doBlackout(s.blackout);
      } else {
        await sleep(s.dur);
      }

      li.classList.remove("running");
      li.classList.add("done");
    }

    await sleep(400);

    topbar.classList.add("hidden");
    content.classList.add("hidden");
    await sleep(300);

    await runFinalLogs();

    bootScreen.classList.add("show");
  }

  startBtn.addEventListener("click", startExploit, { passive: true });

  document.addEventListener("touchmove", e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  document.addEventListener("gesturestart", e => e.preventDefault());
})();
</script>
</body>
</html>
